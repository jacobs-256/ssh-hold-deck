<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSH Hold 管理台</title><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/vendor/xterm.css"></head><body class="auth-locked"><aside class="sidebar"><div class="logo"><span>⌁</span><div><b>SSH Hold</b><small>v0.1.0</small></div></div><div class="side-label">通道管理</div><nav><button class="active">▦　通道列表</button></nav><div class="side-label">集成管理</div><nav class="integration-nav" aria-label="集成管理"><button id="jumpserver-menu" type="button" title="JumpServer 配置" aria-label="JumpServer 配置" aria-haspopup="dialog" aria-controls="jumpserver-settings" aria-expanded="false"><i data-lucide="server-cog"></i><span>JumpServer</span></button></nav></aside><main><header><div><div class="crumb">SSH Hold　/　通道列表</div><h1>通道管理</h1><p>管理本机 SSH Hold 通道与连接状态</p></div></header><section class="workspace"><div class="filters"><div class="search"><span>⌕</span><input id="search" placeholder="搜索通道名、目标地址..."></div><select id="status"><option value="">全部状态</option><option>畅通</option><option>已断开</option></select><select id="auth-filter"><option value="">全部认证</option><option value="key">SSH 私钥</option><option value="password">用户名 / 密码</option></select><button id="refresh" class="square" title="刷新">↻</button><button id="add" class="primary">＋ 添加通道</button></div><div class="summary"><div><span>全部通道</span><strong id="total">-</strong></div><div><span>畅通</span><strong id="up">-</strong></div><div><span>已断开</span><strong id="down">-</strong></div></div><div class="table-wrap"><table><thead><tr><th>通道名称</th><th>目标地址</th><th>跳板机</th><th>认证方式</th><th>状态</th><th>保活</th><th>开通时间</th><th>操作</th></tr></thead><tbody id="list"></tbody></table></div><footer><span id="result-count">显示 0 条结果</span></footer></section></main><dialog id="modal"><form method="dialog" id="form"><div class="modal-head"><div><p class="eyebrow">CHANNEL CONFIGURATION</p><h2 id="modal-title">新增通道</h2></div><button value="cancel" class="close">×</button></div><label>通道名称<input name="name" required pattern="[A-Za-z0-9._-]+" placeholder="例如 prod-us-01"></label><label>用户名<input name="username" required placeholder="例如 root" autocomplete="username"></label><div class="row"><label>主机<input name="host" required placeholder="IP 地址或域名"></label><label>端口<input name="port" type="number" min="1" max="65535" value="22"></label></div><label>认证方式<select name="auth" id="auth"><option value="password">用户名 / 密码</option><option value="key">SSH 私钥</option></select></label><label id="password-field">密码<input name="password" type="password" autocomplete="new-password" placeholder="仅保存于本机加密凭据库"></label><label id="identity-field" hidden>私钥路径<input name="identity" placeholder="/Users/me/.ssh/id_ed25519"></label><label class="check"><input name="insecure" type="checkbox"> 跳过主机指纹校验（仅临时跳板使用）</label><p id="form-error" class="error"></p><div class="actions"><button value="cancel" class="secondary">取消</button><button id="submit" class="primary" value="default">保存并连接</button></div></form></dialog><script src="/vendor/xterm.js"></script><script src="/vendor/fit.js"></script><script src="/vendor/lucide.js"></script><script src="/i18n.js"></script><script src="/auth-ui.js"></script></body></html>
