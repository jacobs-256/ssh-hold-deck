[package]
name = "ssh-hold-deck"
version = "1.2.0"
description = "SSH Hold Deck desktop application"
edition = "2021"
rust-version = "1.90"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ssh-hold-backend = { path = "../backend-rust" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

