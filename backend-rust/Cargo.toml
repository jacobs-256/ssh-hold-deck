[package]
name = "ssh-hold-backend"
version = "1.2.3"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
aes-gcm = "0.10"
scrypt = "0.11"
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
url = "2"
httpdate = "1"
hostname = "0.4"
whoami = "1"
portable-pty = "0.9"
regex = "1"
if-addrs = "0.15"
serde_yaml = "0.9"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
