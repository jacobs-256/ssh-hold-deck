name: Desktop Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or reuse (for example v1.0.0)
        required: true
        type: string
      apple_signing:
        description: Enable Developer ID signing and notarization (requires valid Apple secrets)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  NODE_VERSION: '24.22.0'

jobs:
  prepare:
    name: Prepare release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Resolve and validate release commit
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git checkout --detach "refs/tags/$RELEASE_TAG"
          elif [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          fi
          node scripts/check-release-version.mjs
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm test

  wsl-backend:
    needs: [prepare, validate]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm run desktop:verify
      - run: tar -czf wsl-backend.tar.gz -C desktop backend
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wsl-backend
          path: wsl-backend.tar.gz
          retention-days: 7

  build:
    needs: [prepare, validate, wsl-backend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: macos-arm64
            bundles: app,dmg
          - runner: macos-15-intel
            label: macos-x64
            bundles: app,dmg
          - runner: windows-latest
            label: windows-x64
            bundles: nsis
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: src-tauri
          save-if: false
      - run: npm ci
      - name: Validate Apple signing certificate before compiling
        if: runner.os == 'macOS' && inputs.apple_signing == true
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          node --input-type=module <<'NODE'
          import { mkdtempSync, writeFileSync, rmSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { spawnSync } from 'node:child_process';
          import { randomUUID } from 'node:crypto';
          const encoded = (process.env.APPLE_CERTIFICATE || '').replace(/\s/g, '');
          if (!encoded) {
            throw Error('Apple signing was enabled but APPLE_CERTIFICATE is missing. Disable apple_signing for an ad-hoc test build.');
          }
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(encoded) || encoded.length % 4 !== 0) {
            throw Error('APPLE_CERTIFICATE must be the Base64 contents of an exported .p12 including its private key, not a filename, .cer, or PEM text.');
          }
          const directory = mkdtempSync(join(tmpdir(), 'deck-signing-check-'));
          const keychain = join(directory, 'check.keychain-db');
          const certificate = join(directory, 'certificate.p12');
          const password = randomUUID();
          const security = args => spawnSync('/usr/bin/security', args, { encoding: 'utf8' });
          try {
            writeFileSync(certificate, Buffer.from(encoded, 'base64'), { mode: 0o600 });
            if (security(['create-keychain', '-p', password, keychain]).status !== 0 ||
                security(['unlock-keychain', '-p', password, keychain]).status !== 0) {
              throw Error('Cannot create the temporary signing-validation keychain.');
            }
            const imported = security(['import', certificate, '-k', keychain, '-f', 'pkcs12',
              '-P', process.env.APPLE_CERTIFICATE_PASSWORD || '', '-T', '/usr/bin/codesign']);
            if (imported.status !== 0) {
              throw Error('Apple certificate import failed. Re-export a .p12 WITH its private key, Base64-encode that file, and set APPLE_CERTIFICATE_PASSWORD to its export password. Certificate contents and tool output are withheld.');
            }
            const identities = security(['find-identity', '-v', '-p', 'codesigning', keychain]);
            if (identities.status !== 0 || !identities.stdout.includes('Developer ID Application:')) {
              throw Error('The .p12 must contain a valid Developer ID Application certificate AND its matching private key.');
            }
            const identity = process.env.APPLE_SIGNING_IDENTITY;
            if (!identity || identity === '-' || !identities.stdout.includes(identity)) {
              throw Error('Set APPLE_SIGNING_IDENTITY to the Developer ID Application identity contained in the .p12.');
            }
            console.log('Apple Developer ID certificate import and signing identity validated.');
          } finally {
            security(['delete-keychain', keychain]);
            rmSync(directory, { recursive: true, force: true });
          }
          NODE
      - name: Prepare native macOS backend
        if: runner.os == 'macOS'
        run: npm run desktop:prepare
      - name: Verify native macOS backend
        if: runner.os == 'macOS'
        run: npm run desktop:verify
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: runner.os == 'Windows'
        with:
          name: wsl-backend
      - name: Extract WSL backend
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tar -xzf wsl-backend.tar.gz -C desktop
          cp build/icons/default/icon.png desktop/loading/icon.png
      - name: Build desktop installer
        env:
          ENABLE_APPLE_SIGNING: ${{ runner.os == 'macOS' && inputs.apple_signing == true }}
          DESKTOP_BUNDLES: ${{ matrix.bundles }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          const env = { ...process.env };
          const signing = env.ENABLE_APPLE_SIGNING === 'true';
          for (const key of Object.keys(env)) {
            if (key.startsWith('APPLE_') && (!signing || !env[key])) delete env[key];
          }
          if (process.platform === 'darwin' && !signing) {
            env.APPLE_SIGNING_IDENTITY = '-';
            console.log('macOS signing mode: ad-hoc. Apple certificate import and notarization are disabled.');
          }
          const result = spawnSync(process.platform === 'win32' ? 'npm.cmd' : 'npm',
            ['run', 'desktop:build', '--', '--bundles', env.DESKTOP_BUNDLES, '--', '--locked'],
            { env, stdio: 'inherit', shell: process.platform === 'win32' });
          if (result.error) throw result.error;
          process.exit(result.status ?? 1);
          NODE
      - name: Verify macOS application identity and signature
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-bundle.mjs
      - name: Collect installer and checksum
        run: node scripts/collect-desktop.mjs ${{ matrix.label }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.label }}
          path: dist-desktop/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-*
          merge-multiple: true
          path: installers
      - name: Verify and upload all installers
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.dmg' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.exe' | wc -l)" -eq 1
          cat ./*.sha256 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./*.dmg ./*.exe SHA256SUMS.txt --repo "$REPOSITORY" --clobber
          else
            release_args=()
            if [[ "$RELEASE_TAG" == *-* ]]; then release_args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" \
              --title "SSH Hold Deck $RELEASE_TAG" --generate-notes --verify-tag \
              "${release_args[@]}" ./*.dmg ./*.exe SHA256SUMS.txt
          fi
